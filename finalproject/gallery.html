        <nav>

    <!-- Main Content Area -->
    <main class="gallery-main">
        <h2 class="Main-title">Student & Workshop Gallery</h2>
        <p class="gallery-intro">Take a look inside our hands-on tech training sessions, robotics prototyping, and young
            innovators in action.</p>

        <!-- Gallery Grid Container -->
        <section class="gallery-grid">
            <figure class="gallery-card">
                <img src="images/placeholder-robotics.webp" alt="Students assembling robotics kits" loading="lazy"
                    width="400" height="300">
                <figcaption>Students assembling Arduino rover chassis during hardware lab.</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/placeholder-coding.webp" alt="Kids learning Python programming" loading="lazy"
                    width="400" height="300">
                <figcaption>Young programmers testing their first Python logic scripts.</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/placeholder-workshop.webp" alt="STEM workshop session" loading="lazy" width="400"
                    height="300">
                <figcaption>Interactive problem-solving workshop at our Tema training center.</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/placeholder-soldering.webp" alt="Circuit soldering practice" loading="lazy" width="400"
                    height="300">
                <figcaption>Advanced students practicing safe component soldering techniques.</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/placeholder-design.webp" alt="Web design collaboration" loading="lazy" width="400"
                    height="300">
                <figcaption>Collaborative web layout design and prototyping session.</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/placeholder-expo.webp" alt="Robotics exhibition showcase" loading="lazy" width="400"
                    height="300">
                <figcaption>Showcase day: presenting smart dryline to parents and mentors.</figcaption>
            </figure>
        </section>
